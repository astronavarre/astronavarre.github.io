        url: https://iopscience.iop.org/article/10.3847/1538-4357/ad10ad/pdf
        summary: We present six strongly gravitationally lensed Lyα emitters (LAEs) at z ∼ 4-5 with Hubble Space Telescope (HST) narrowband imaging isolating Lyα. We find a suggestive trend -- our LAEs with clumpy Lyα are generally younger than the LAEs with extended Lyα, suggesting a possible correlation with age. 


