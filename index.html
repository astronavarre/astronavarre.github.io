<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alexander Navarre</title>
<style>
  :root {
    --bg: #0f172a;
    --accent: #38bdf8;
    --text: #e2e8f0;
    --muted: #94a3b8;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    text-align: center;
    padding: 20px;
  }

  .container {
    max-width: 480px;
  }

  h1 {
    font-size: 2rem;
    margin-bottom: 12px;
    letter-spacing: -0.5px;
  }

  .badge {
    display: inline-block;
    background: rgba(56, 189, 248, 0.12);
    color: var(--accent);
    border: 1px solid rgba(56, 189, 248, 0.4);
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 24px;
  }

  p {
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 28px;
  }

  .links a {
    color: var(--text);
    text-decoration: none;
    border: 1px solid #334155;
    padding: 10px 20px;
    border-radius: 8px;
    margin: 0 6px;
    font-size: 0.9rem;
    transition: border-color 0.2s ease, color 0.2s ease;
    display: inline-block;
  }

  .links a:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .bar {
    width: 100%;
    height: 4px;
    background: #1e293b;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 28px;
  }

  .bar-fill {
    width: 40%;
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    animation: pulse 1.8s ease-in-out infinite;
  }

  @keyframes pulse {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(250%); }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="badge">Site Under Construction</div>
    <h1>Alexander Navarre</h1>
    <p>
      I'm rebuilding my portfolio site. In the meantime, feel free to reach out
      or check my resume and LinkedIn below.
    </p>
    <div class="bar"><div class="bar-fill"></div></div>
    <div class="links">
      <a href="mailto:aenavarre@proton.me">Email</a>
      <a href="https://www.linkedin.com/in/alexander-navarre/" target="_blank">LinkedIn</a>
      <a href="https://github.com/astronavarre" target="_blank">GitHub</a>
    </div>
  </div>
</body>
</html>
